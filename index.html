<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ORTE · RESPO‑TARGET‑SCENE · iki1uc</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:Consolas, monospace;
    padding:25px;
}
h1 {
    color:#6cf;
    text-shadow:0 0 12px #6cf;
    margin-bottom:30px;
    text-align:center;
}
.block {
    background:#111;
    border:1px solid #333;
    padding:20px;
    margin-bottom:25px;
    border-radius:8px;
}
.title {
    font-size:22px;
    color:#6cf;
    margin-bottom:10px;
}
pre {
    background:#000;
    border-left:3px solid #6cf;
    padding:15px;
    white-space:pre-wrap;
}
</style>

<script type="module">
import { ORT_CORE } from "./core.axm";
import { ORT_RESPO } from "./ORT.respo";
import { ORT_FREQ } from "./Freq.html";
import { ORTEN_Q } from "./Q/Q.js";

// ORTE Engine
async function ORTE_START(){

    // ORT Original
    const ort = ORT_CORE();

    // ORTE Respo
    const respo = ORT_RESPO(ort);

    // Frequenz 12e
    const freq = ORT_FREQ();

    // Q‑Lage
    const qlage = ORTEN_Q();

    // ORTE Target‑Scene
    const scene = {
        ort,
        respo,
        freq,
        qlage,
        d5: "ORTE‑D5‑Achse",
        matrix: "6D‑Matrix",
        tmp: "TMP‑Konstellationen",
        frame: "ORTE‑TARGET‑SCENE"
    };

    return scene;
}

// UI
window.onload = async () => {
    const out = await ORTE_START();
    document.getElementById("out").textContent =
        JSON.stringify(out, null, 2);
};
</script>

</head>

<body>

</div>

</body>
